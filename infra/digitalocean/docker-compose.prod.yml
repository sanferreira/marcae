name: marcae

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      APP_DOMAIN: ${APP_DOMAIN}
      LANDING_DOMAIN: ${LANDING_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - api
      - mobile
      - landing

  api:
    image: marcae-api
    build:
      context: ../..
      dockerfile: infra/digitalocean/api.Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 8082
      DATABASE_URL: ${DATABASE_URL}
      APP_BASE_URL: https://${APP_DOMAIN}
      PUBLIC_APP_URL: https://${APP_DOMAIN}
      CORS_ORIGINS: https://${APP_DOMAIN},https://${LANDING_DOMAIN}
      AUTH_COOKIE_ENABLED: "false"
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    expose:
      - "8082"
    depends_on:
      postgres:
        condition: service_healthy

  mobile:
    image: marcae-mobile
    build:
      context: ../..
      dockerfile: infra/digitalocean/mobile.Dockerfile
      args:
        APP_DOMAIN: ${APP_DOMAIN}
        EXPO_PUBLIC_API_URL: https://${APP_DOMAIN}/api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      BASE_PATH: /
    expose:
      - "3000"

  landing:
    image: marcae-landing
    build:
      context: ../..
      dockerfile: infra/digitalocean/landing.Dockerfile
      args:
        APP_BASE_URL: https://${APP_DOMAIN}
        LANDING_BASE_PATH: /
        VITE_SUPPORT_URL: ${VITE_SUPPORT_URL:-}
    restart: unless-stopped
    expose:
      - "80"

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  migrate:
    image: marcae-api
    profiles:
      - tools
    environment:
      DATABASE_URL: ${DATABASE_URL}
    depends_on:
      postgres:
        condition: service_healthy
    command: ["pnpm", "--filter", "@workspace/db", "run", "push"]

volumes:
  postgres-data:
  caddy-data:
  caddy-config:
